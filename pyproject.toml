[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "angelus"
dynamic = ["version"]
description = "Local observable Agent control plane built on LLMFetcher"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "llmfetcher>=0.4.0,<0.5.0",
    "markdown-it-py",
    "mcp>=2,<3",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
geoint = [
    # Required for GeoTIFF inspection/display preparation and Shapefile (OGR)
    # import.  Kept outside the control-plane base install because it bundles
    # native geospatial libraries and is not needed by non-GEOINT Angelus use.
    "GDAL>=3.6,<4",
]
postgis = [
    # Exact geometry intersection is an optional GEOINT backend capability.
    "psycopg[binary]>=3.2,<4",
]
test = [
    "pytest>=8",
]
desktop = [
    "pyinstaller>=6.10",
]

[project.scripts]
angelus = "angelus.cli:main"
angelus-web = "angelus.cli:main"

[tool.setuptools.packages.find]
include = ["angelus*"]

[tool.setuptools.dynamic]
version = {attr = "angelus._version.__version__"}
