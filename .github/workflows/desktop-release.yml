name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf gdal-bin libgdal-dev

      - name: Install Python and JavaScript dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy
          python -m pip install --no-build-isolation -e ./llmfetcher
          python -m pip install --no-build-isolation -e ".[test]"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # GDAL is source-only on PyPI: match the system libgdal version.
            python -m pip install --no-build-isolation "GDAL==$(gdal-config --version)"
            python -m pip install --no-build-isolation -r requirements-desktop.txt
          else
            # Windows: no GDAL wheel and no gdal-config; the sidecar still
            # installs without the geospatial extra.
            python -m pip install --no-build-isolation -e ".[desktop]"
          fi
          npm ci

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          releaseName: Angelus ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          releaseBody: Automated desktop builds for ${{ github.ref_name }}.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
