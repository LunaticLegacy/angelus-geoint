name: CI

on:
  push:
    branches: [main, develop, private/geoint-drought]
  pull_request:
    branches: [main, develop, private/geoint-drought]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Record llmfetcher submodule revision
        # Audit trail. `.gitmodules` says `branch = main`, so the reviewed commit
        # is only visible through the gitlink; print it before anything installs.
        run: |
          git submodule status llmfetcher
          echo "llmfetcher HEAD: $(git -C llmfetcher rev-parse HEAD)"
          git -C llmfetcher describe --tags --always 2>/dev/null || echo "(git describe unavailable: shallow or tagless submodule clone)"

      - name: Assert llmfetcher submodule satisfies the pyproject constraint
        # Blocks the drift that `branch = main` invites: the gitlink (or a lone
        # pyproject bump) can slide the pinned version outside the declared range
        # with nothing else noticing. Also fails when the working tree points at
        # a different commit than the one recorded in the index (`git submodule
        # update --remote` without `git add llmfetcher`).
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          NAME = "llmfetcher"


          def fail(message):
              print("::error::" + message)
              sys.exit(1)


          def as_tuple(version):
              match = re.match(r"\s*v?(\d+(?:\.\d+)*)", version)
              if match is None:
                  fail(f"{NAME}: cannot parse a release version out of {version!r}")
              return tuple(int(part) for part in match.group(1).split("."))


          def compare(left, right):
              width = max(len(left), len(right))
              left = left + (0,) * (width - len(left))
              right = right + (0,) * (width - len(right))
              return (left > right) - (left < right)


          # 1. Declared range, read from pyproject so the two can never disagree.
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          specifier = None
          for dependency in project.get("dependencies", []):
              match = re.match(r"\s*([A-Za-z0-9._-]+)\s*(?P<spec>.*)$", dependency)
              if match and match.group(1).lower() == NAME:
                  specifier = match.group("spec").strip()
                  break
          if not specifier:
              fail(f"pyproject.toml declares no requirement for {NAME}")

          # 2. Version of the checked-out submodule. `_version.py` is the source of
          #    truth and is readable before the editable install runs.
          version_file = Path(NAME) / "_version.py"
          if not version_file.is_file():
              fail(f"{NAME}/_version.py is missing: were submodules checked out recursively?")
          match = re.search(
              r'^LLMFETCHER_VERSION\s*=\s*"([^"]+)"',
              version_file.read_text(encoding="utf-8"),
              re.MULTILINE,
          )
          if match is None:
              fail(f"cannot find LLMFETCHER_VERSION in {version_file}")
          version = match.group(1)

          # 3. Every clause of the specifier must accept that version.
          base = as_tuple(version)
          for clause in (piece.strip() for piece in specifier.split(",") if piece.strip()):
              clause_match = re.fullmatch(
                  r"(===|==|>=|>|<=|<|!=|~=)\s*([0-9][0-9A-Za-z.*+!-]*)", clause
              )
              if clause_match is None:
                  fail(f"unsupported specifier clause {clause!r} in {NAME}{specifier}")
              operator, bound_text = clause_match.groups()
              bound = as_tuple(bound_text)
              ordering = compare(base, bound)
              if operator in ("==", "==="):
                  accepted = ordering == 0
              elif operator == ">=":
                  accepted = ordering >= 0
              elif operator == ">":
                  accepted = ordering > 0
              elif operator == "<=":
                  accepted = ordering <= 0
              elif operator == "<":
                  accepted = ordering < 0
              elif operator == "!=":
                  accepted = ordering != 0
              else:  # "~=": at least the bound, and the same leading release prefix.
                  accepted = ordering >= 0 and base[:2] == bound[:2]
              if not accepted:
                  fail(f"{NAME} {version} violates pyproject constraint {NAME}{specifier}")

          # 4. The checked-out commit must be the one HEAD records. Runs after the
          #    version checks so a version problem is reported as such, not as a
          #    pointer mismatch: `git submodule update --remote` leaves this drift.
          recorded = subprocess.check_output(["git", "ls-tree", "HEAD", NAME], text=True).split()
          head = subprocess.check_output(["git", "-C", NAME, "rev-parse", "HEAD"], text=True).strip()
          if len(recorded) >= 3 and recorded[2] != head:
              fail(
                  f"{NAME}: working tree is at {head} but HEAD records {recorded[2]}; "
                  f"run `git add {NAME}` to commit the pointer bump"
              )

          # 5. Informational: reconcile the nearest tag with `_version.py` so a
          #    stale or retagged submodule shows up in the log. Non-fatal because
          #    shallow clones legitimately have no tags.
          try:
              describe = subprocess.run(
                  ["git", "-C", NAME, "describe", "--tags", "--always"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
          except subprocess.CalledProcessError:
              describe = "(unavailable)"
          tag_match = re.fullmatch(r"v?(?P<tag>\d+(?:\.\d+)*)-\d+-g[0-9a-f]+", describe)
          if tag_match and compare(as_tuple(tag_match.group("tag")), base) != 0:
              fail(f"{NAME} {version} disagrees with its nearest tag {describe}")

          print(f"OK {NAME} {version} (describe: {describe}) satisfies {NAME}{specifier} at {head}")
          PY
      - name: Install GEOINT test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e ./llmfetcher
          # Keep Python GDAL and libgdal ABI-compatible in every test leg.
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
          python -m pip install numpy
          python -m pip install --no-build-isolation "GDAL==$(gdal-config --version)"
          python -m pip install --no-build-isolation -e '.[geoint,test]'

      - name: Run tests
        run: |
          python -m pytest tests -v

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compile source
        run: |
          python -m compileall -q angelus/ tests/

  build:
    runs-on: ubuntu-latest
    needs: [test, checks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/angelus-wheel-check
          # llmfetcher is a submodule, not on PyPI: install it locally so the
          # wheel's llmfetcher>=0.6.0,<0.7.0 requirement resolves without hitting PyPI.
          /tmp/angelus-wheel-check/bin/python -m pip install ./llmfetcher
          /tmp/angelus-wheel-check/bin/python -m pip install --no-build-isolation dist/*.whl
          /tmp/angelus-wheel-check/bin/python -c "import angelus; print('Angelus imported successfully')"

  desktop-build:
    name: Desktop build check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,rpm
            artifact: linux
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: windows
    runs-on: ${{ matrix.os }}
    needs: [test, checks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf gdal-bin libgdal-dev

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy
          python -m pip install --no-build-isolation -e ./llmfetcher
          python -m pip install --no-build-isolation -e ".[test]"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # GDAL is source-only on PyPI: match the system libgdal version.
            python -m pip install --no-build-isolation "GDAL==$(gdal-config --version)"
            python -m pip install --no-build-isolation -r requirements-desktop.txt
          else
            # Windows: no GDAL wheel and no gdal-config; the sidecar still
            # installs without the geospatial extra.
            python -m pip install --no-build-isolation -e ".[desktop]"
          fi
          npm ci

      - name: Build desktop packages
        run: npm run build -- --bundles ${{ matrix.bundles }}

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: angelus-${{ matrix.artifact }}-packages
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
